name: MainUi quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MainUi and integrated MainCourse APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainUi
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainUi

      - name: Checkout pinned AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: 93fc56c635ed970ae1b26807b6eb93892398d2d3
          path: AS-Academy-Core

      - name: Checkout AS Academy MainCourse
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainCourse
          path: AS-Academy-MainCourse

      - name: Verify Core/MainCourse integration contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("AS-Academy-Core/integration/contract.json").read_text())
          schema = contract["contentSchemaVersion"]
          required = contract["courseManifestRequiredFields"]
          canonical = 0
          legacy = []
          for path in sorted(Path("AS-Academy-MainCourse/courses").glob("*/course/manifest.json")):
              manifest = json.loads(path.read_text(encoding="utf-8"))
              if "courseId" not in manifest:
                  legacy.append(path.parts[-3])
                  continue
              canonical += 1
              missing = [key for key in required if key not in manifest]
              if missing:
                  raise SystemExit(f"{path}: missing required contract fields {missing}")
              if manifest["contentSchemaVersion"] != schema:
                  raise SystemExit(f"{path}: schema {manifest['contentSchemaVersion']} != Core schema {schema}")
          if canonical == 0:
              raise SystemExit("No canonical MainCourse manifests were found")
          print(f"Validated {canonical} canonical course manifest(s) against Core schema {schema}")
          if legacy:
              print("Legacy manifests pending migration: " + ", ".join(legacy))
          PY

      - name: Bundle MainCourse snapshot into viewer assets
        shell: bash
        run: |
          set -euo pipefail
          asset_root="AS-Academy-MainUi/academy-viewer/src/main/assets/maincourse"
          rm -rf "$asset_root"
          mkdir -p "$asset_root"
          cp -R AS-Academy-MainCourse/courses "$asset_root/courses"
          git -C AS-Academy-MainCourse rev-parse HEAD > "$asset_root/snapshot-sha.txt"
          git -C AS-Academy-Core rev-parse HEAD > "$asset_root/core-sha.txt"
          printf 'Bundled %s course folders\n' "$(find "$asset_root/courses" -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Validate release-ready MainCourse and audit migrations
        shell: bash
        run: |
          set -o pipefail
          python3 AS-Academy-MainUi/.github/scripts/validate_maincourse_snapshot.py \
            AS-Academy-MainCourse/courses \
            --ready basic \
            --audit-all 2>&1 | tee maincourse-validation.log

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test MainUi
        shell: bash
        run: |
          set +e
          ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:testDebugUnitTest --stacktrace --console=plain > mainui-test.log 2>&1
          status=$?
          tail -n 250 mainui-test.log
          exit $status

      - name: Compile MainUi and viewer APK
        if: success()
        shell: bash
        run: |
          set +e
          ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:assembleDebug :academy-viewer:assembleDebug --stacktrace --console=plain > mainui-build.log 2>&1
          status=$?
          tail -n 250 mainui-build.log
          exit $status

      - name: Lint MainUi and viewer
        if: success()
        shell: bash
        run: |
          set +e
          ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:lintDebug :academy-viewer:lintDebug --stacktrace --console=plain > mainui-lint.log 2>&1
          status=$?
          tail -n 250 mainui-lint.log
          exit $status

      - name: Prepare installable preview APK
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          cp AS-Academy-MainUi/academy-viewer/build/outputs/apk/debug/academy-viewer-debug.apk dist/AS-Academy-MainCourse-0.1.0-preview.apk
          sha256sum dist/AS-Academy-MainCourse-0.1.0-preview.apk > dist/AS-Academy-MainCourse-0.1.0-preview.apk.sha256

      - name: Upload MainCourse viewer APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-MainCourse-Viewer-${{ github.sha }}
          path: |
            dist/AS-Academy-MainCourse-0.1.0-preview.apk
            dist/AS-Academy-MainCourse-0.1.0-preview.apk.sha256
          if-no-files-found: error

      - name: Upload MainUi diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainui-diagnostics-${{ github.sha }}
          path: |
            maincourse-validation.log
            mainui-test.log
            mainui-build.log
            mainui-lint.log
            AS-Academy-MainUi/main-ui/build/reports/tests/testDebugUnitTest/
            AS-Academy-MainUi/main-ui/build/reports/lint-results-debug.html
            AS-Academy-MainUi/main-ui/build/reports/lint-results-debug.xml
            AS-Academy-MainUi/academy-viewer/build/reports/lint-results-debug.html
            AS-Academy-MainUi/academy-viewer/build/reports/lint-results-debug.xml
          if-no-files-found: warn
