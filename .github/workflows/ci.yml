name: MainUi quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mainui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MainUi, viewer and thin app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainUi
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainUi

      - name: Checkout pinned AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: fdef97043080f51e5a1e5bff4b8d5374543e3365
          path: AS-Academy-Core

      - name: Checkout pinned AS Academy MainCourse
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainCourse
          ref: ef1a69fa23c86af50275ee7ead38641f1643228b
          path: AS-Academy-MainCourse

      - name: Verify Foundation integration contract
        run: python3 AS-Academy-Core/integration/validate_contract.py --peer AS-Academy-MainUi/integration/contract.json --peer AS-Academy-MainCourse/integration/contract.json

      - name: Validate release-ready Basic content and audit migrations
        run: python3 AS-Academy-MainUi/.github/scripts/validate_maincourse_snapshot.py AS-Academy-MainCourse/courses --ready basic --audit-all

      - name: Bundle MainCourse snapshot into viewer assets
        shell: bash
        run: |
          set -euo pipefail
          asset_root="AS-Academy-MainUi/academy-viewer/src/main/assets/maincourse"
          rm -rf "$asset_root"
          mkdir -p "$asset_root"
          cp -R AS-Academy-MainCourse/courses "$asset_root/courses"
          git -C AS-Academy-MainCourse rev-parse HEAD > "$asset_root/snapshot-sha.txt"
          git -C AS-Academy-Core rev-parse HEAD > "$asset_root/core-sha.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Core unit gates
        run: ./AS-Academy-Core/gradlew -p AS-Academy-Core :engine:test :core:testDebugUnitTest --stacktrace --console=plain

      - name: Test MainUi with composite Core
        run: ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:testDebugUnitTest --stacktrace --console=plain

      - name: Build all MainUi consumers
        run: ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:assembleDebug :academy-viewer:assembleDebug :thin-app-template:assembleDebug --stacktrace --console=plain

      - name: Lint all MainUi consumers
        run: ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:lintDebug :academy-viewer:lintDebug :thin-app-template:lintDebug --stacktrace --console=plain

      - name: Prepare preview APKs
        shell: bash
        run: |
          mkdir -p dist
          cp AS-Academy-MainUi/academy-viewer/build/outputs/apk/debug/academy-viewer-debug.apk dist/AS-Academy-MainCourse-preview.apk
          cp AS-Academy-MainUi/thin-app-template/build/outputs/apk/debug/thin-app-template-debug.apk dist/AS-Academy-ThinApp-preview.apk
          sha256sum dist/*.apk > dist/SHA256SUMS

      - name: Upload consumer APKs
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Consumers-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
