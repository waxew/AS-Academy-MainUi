name: Build MainCourse Web PWA

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    # MainCourse lives in a separate repository. Rebuild the public snapshot hourly.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: maincourse-web
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainUi
        uses: actions/checkout@v5

      - name: Checkout latest MainCourse
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainCourse
          path: AS-Academy-MainCourse

      - name: Validate web JavaScript
        run: |
          node --check web/app.js
          node --check web/sw.js
          node --check web/scripts/build-index.mjs

      - name: Prepare integrated web site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp -R web/. _site/
          rm -rf _site/scripts
          cp -R AS-Academy-MainCourse/courses _site/data/courses
          export MAINCOURSE_SHA="$(git -C AS-Academy-MainCourse rev-parse HEAD)"
          node web/scripts/build-index.mjs AS-Academy-MainCourse/courses _site/data/index.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/index.json
          node -e "const i=require('./_site/data/index.json'); const fileCount=i.courses.reduce((n,c)=>n+c.files.length,0); if(!i.courses.length || !fileCount) process.exit(1); console.log('Web snapshot:', i.courses.length, 'courses', fileCount, 'files')"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-MainCourse-Web
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Publish ready-to-serve gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: MainCourse web ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
